kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.4
    package-operator.run/phase: crds
    package-operator.run/collision-protection: IfNoController
  name: upgradereadinesschecks.upgrade.managed.openshift.io
spec:
  group: upgrade.managed.openshift.io
  names:
    kind: UpgradeReadinessCheck
    listKind: UpgradeReadinessCheckList
    plural: upgradereadinesschecks
    shortNames:
      - pfc
    singular: upgradereadinesscheck
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .spec.desired.version
          name: version
          type: string
        - jsonPath: .spec.desired.channel
          name: channel
          type: string
        - jsonPath: .spec.type
          name: type
          type: string
        - jsonPath: .status.overallResult
          name: status
          type: string
          description: Overall check result
        - jsonPath: .status.checksPassed
          name: passed
          type: integer
        - jsonPath: .status.checksWarned
          name: warned
          type: integer
        - jsonPath: .status.checksFailed
          name: failed
          type: integer
        - jsonPath: .status.completedAt
          name: completed
          type: string
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: UpgradeReadinessCheck is the Schema for on-demand cluster upgrade readiness checks.
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                May be inferred from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              description: UpgradeReadinessCheckSpec defines the target upgrade to check readiness for.
              properties:
                capacityReservation:
                  description: CapacityReservation is reserved for future use.
                  properties:
                    nodes:
                      description: Nodes defines the nodes to reserve capacity on.
                      type: integer
                  type: object
                checkTimeoutSeconds:
                  default: 30
                  description: CheckTimeoutSeconds is the maximum number of seconds each individual check may run before it is cancelled and recorded as State=Error.
                  format: int32
                  type: integer
                checks:
                  description: Checks is an optional allowlist of check names to run. When empty, all checks run.
                  items:
                    type: string
                  type: array
                desired:
                  description: Desired is the target version and channel for upgrade.
                  properties:
                    channel:
                      type: string
                    version:
                      type: string
                  required:
                    - channel
                    - version
                  type: object
                pdbForceDrainTimeout:
                  description: PDBForceDrainTimeout is the drain timeout in seconds.
                  format: int32
                  type: integer
                type:
                  description: Type identifies the platform (OSD or ARO).
                  enum:
                    - OSD
                    - ARO
                  type: string
                upgradeAt:
                  description: UpgradeAt is reserved for future use.
                  format: date-time
                  type: string
              required:
                - desired
                - type
              type: object
            status:
              description: UpgradeReadinessCheckStatus reports the outcome of all checks.
              properties:
                startedAt:
                  description: StartedAt is when the first check began running.
                  format: date-time
                  type: string
                completedAt:
                  description: CompletedAt is when all checks finished.
                  format: date-time
                  type: string
                overallResult:
                  description: |-
                    OverallResult is the top-level verdict once all checks complete.
                    Passed: all checks passed (warnings may be present).
                    Warning: at least one check warned but none failed or errored.
                    Failed: at least one check failed or errored.
                  enum:
                    - Passed
                    - Warning
                    - Failed
                  type: string
                checksPassed:
                  description: ChecksPassed is the number of checks that returned Passed.
                  type: integer
                checksWarned:
                  description: ChecksWarned is the number of checks that returned Warning.
                  type: integer
                checksFailed:
                  description: ChecksFailed is the number of checks that returned Failed.
                  type: integer
                checksErrored:
                  description: ChecksErrored is the number of checks that returned Error or could not run.
                  type: integer
                conditions:
                  description: |-
                    Conditions exposes run state as standard Kubernetes conditions.
                    The Complete condition becomes True when all checks finish; Reason carries
                    the outcome (Passed, Warning, or Failed).
                    Use: oc wait --for=condition=Complete --timeout=5m pfc/<name>
                  items:
                    description: Condition contains details for one aspect of the current state of this API Resource.
                    properties:
                      lastTransitionTime:
                        description: LastTransitionTime is the last time the condition transitioned from one status to another.
                        format: date-time
                        type: string
                      message:
                        description: Message is a human readable message indicating details about the transition.
                        maxLength: 32768
                        type: string
                      observedGeneration:
                        description: ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                        format: int64
                        minimum: 0
                        type: integer
                      reason:
                        description: Reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        maxLength: 1024
                        minLength: 1
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                        type: string
                      status:
                        description: Status of the condition, one of True, False, Unknown.
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                        type: string
                      type:
                        description: Type of condition in CamelCase.
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                        type: string
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    type: object
                  type: array
                  x-kubernetes-list-map-keys:
                    - type
                  x-kubernetes-list-type: map
                checks:
                  description: Checks contains per-check results with findings and recommended actions.
                  items:
                    description: ReadinessCheckResult holds the result and execution details for a single readiness check.
                    properties:
                      name:
                        description: Name identifies the check (e.g. "CriticalAlerts", "ClusterOperators").
                        type: string
                      description:
                        description: Description is a human-readable explanation of what this check validates.
                        type: string
                      result:
                        description: |-
                          Result is the top-level health verdict.
                          Passed: cluster is healthy for this dimension.
                          Warning: non-blocking condition the consumer should review.
                          Failed: health issue that may block upgrade.
                          Error: check could not determine health (infrastructure failure).
                          Skipped: check was excluded by the Checks allowlist.
                          TimedOut: check never started — overall run deadline exceeded.
                        enum:
                          - Passed
                          - Warning
                          - Failed
                          - Error
                          - Skipped
                          - TimedOut
                          - Unknown
                        type: string
                      owner:
                        description: |-
                          Owner identifies who must act when this check fails or errors.
                          customer: the cluster owner must resolve this.
                          service-team: Red Hat must investigate.
                        enum:
                          - customer
                          - service-team
                        type: string
                      action:
                        description: Action is the recommended next step when Result is Failed or Error.
                        type: string
                      timeoutSeconds:
                        description: TimeoutSeconds is the timeout that was applied to this check.
                        format: int32
                        type: integer
                      execution:
                        description: Execution contains runtime information about how the check ran.
                        properties:
                          state:
                            description: 'State is whether the check machinery ran: Completed, Error, Skipped, or TimedOut.'
                            enum:
                              - Completed
                              - Error
                              - Skipped
                              - TimedOut
                            type: string
                          startedAt:
                            description: StartedAt is when this individual check began executing.
                            format: date-time
                            type: string
                          completedAt:
                            description: CompletedAt is when this individual check finished.
                            format: date-time
                            type: string
                          summary:
                            description: Summary is a concise human-readable explanation of what the check found.
                            type: string
                          findings:
                            description: Findings contains detailed per-item observations (alert names, node names, risk details, etc).
                            items:
                              type: string
                            type: array
                          error:
                            description: Error contains the reason a check could not run (State=Error only).
                            type: string
                        required:
                          - state
                        type: object
                    required:
                      - execution
                      - name
                      - result
                      - timeoutSeconds
                    type: object
                  type: array
              type: object
          type: object
      served: true
      storage: true
      subresources:
        status: {}
