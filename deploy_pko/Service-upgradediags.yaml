---
apiVersion: v1
kind: Service
metadata:
  name: upgradediags
  namespace: openshift-managed-upgrade-operator
  annotations:
    package-operator.run/phase: deploy
    package-operator.run/collision-protection: IfNoController
    service.beta.openshift.io/serving-cert-secret-name: upgradediags-tls
  labels:
    name: upgradediags
spec:
  selector:
    name: upgradediags
  ports:
  - name: https
    port: 9443
    targetPort: 9443
    protocol: TCP
  type: ClusterIP
